[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fluvial-refpipe"
version = "0.1.0"
description = "Fluvial reference pipeline (scan → extract → enrich → copy/quarantine → parse → chunk → export)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }

# Dependencies are managed via conda/mamba environment.yml in this repo.

[project.scripts]
refpipe = "refpipe.cli:app"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
